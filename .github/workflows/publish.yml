# WeatherBridge public copy: publishes docs/ to GitHub Pages each time the station uploads.
# Written by the WeatherBridge base station (wb_publish.py); changes made here are replaced on the next upload.
# 2.14.3: Pages actions on Node 24 (configure-pages v6, upload-pages-artifact v5, deploy-pages v5). deploy-pages finds
# the artifact by listing the run's artifacts; right after the upload that list is sometimes still empty ("No artifacts
# named github-pages were found"), so a failed deploy is tried once more after 30 s.
name: Publish
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment2.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs
      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v5
      - name: Wait before trying again
        if: steps.deployment.outcome == 'failure'
        run: sleep 30
      - name: Deploy to GitHub Pages (second try)
        id: deployment2
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
